<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição / Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script carregado no head com defer conforme orientado na aula -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h2>Formulário de Inscrição / Cadastro</h2>

        <form id="cadastroForm">
            <!-- Seção 1: Dados Pessoais -->
            <fieldset class="section">
                <legend class="section-title">1. Dados Pessoais</legend>

                <div class="input-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required minlength="10">
                </div>

                <div class="input-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" placeholder="Ex: maria@email.com" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
                </div>

                <div class="input-group">
                    <label for="nascimento">Data de Nascimento *</label>
                    <input type="date" id="nascimento" name="nascimento" max="2026-09-09" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
            </fieldset>

            <!-- Seção 2: Preferências e Perfil -->
            <fieldset class="section">
                <legend class="section-title">2. Preferências e Perfil</legend>

                <div class="input-group">
                    <label for="area">Área de Interesse *</label>
                    <select id="area" name="area" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="tecnologia">Tecnologia</option>
                        <option value="design">Design</option>
                        <option value="negocios">Negócios</option>
                        <option value="desenvolvimento-mobile">Desenvolvimento Mobile</option>
                        <option value="ciencia-de-dados">Ciência de Dados</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Nível de Experiência</label>
                    <div class="radio-group">
                        <label><input type="radio" name="nivel" value="Iniciante" checked> Iniciante</label>
                        <label><input type="radio" name="nivel" value="Intermediário"> Intermediário</label>
                        <label><input type="radio" name="nivel" value="Avançado"> Avançado</label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="biografia">Biografia / Apresentação</label>
                    <textarea id="biografia" name="biografia" placeholder="Conte um pouco sobre suas expectativas..."></textarea>
                </div>
            </fieldset>

            <!-- Seção 3: Redes Sociais -->
            <fieldset class="section">
                <legend class="section-title">3. Redes Sociais</legend>

                <div class="input-group">
                    <label for="instagram">Instagram *</label>
                    <input type="url" id="instagram" name="instagram" placeholder="https://instagram.com/seuusuario" required>
                </div>

                <div class="input-group">
                    <label for="github">GitHub *</label>
                    <input type="url" id="github" name="github" placeholder="https://github.com/seuusuario" required>
                </div>
            </fieldset>

            <!-- Checkbox de Termos -->
            <div class="checkbox-group">
                <input type="checkbox" id="novidades" name="novidades">
                <label for="novidades">Aceito receber novidades por e-mail</label>
            </div>

            <!-- Botões de Ação -->
            <button type="submit" class="btn-submit">Concluir Cadastro</button>
            <button type="reset" class="btn-reset">Limpar Formulário</button>
        </form>
    </div>

</body>
</html>
