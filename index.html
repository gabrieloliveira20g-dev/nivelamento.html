<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição / Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Formulário de Inscrição / Cadastro</h2>

        <form id="cadastroForm">
            <!-- Seção 1: Dados Pessoais (Com Exercício 2 e Exercício 4) -->
            <fieldset class="section">
                <legend class="section-title">1. Dados Pessoais</legend>

                <div class="input-group">
                    <label for="nome">Nome Completo *</label>
                    <!-- Exercício 4.1: minlength="10" -->
                    <input type="text" id="nome" placeholder="Ex: Maria Silva" required minlength="10">
                </div>

                <div class="input-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="Ex: maria@email.com" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="text" id="telefone" placeholder="(11) 99999-9999">
                </div>

                <div class="input-group">
                    <label for="nascimento">Data de Nascimento *</label>
                    <!-- Exercício 4.2: max configurado para a data de hoje -->
                    <input type="date" id="nascimento" max="2026-09-09" required>
                </div>

                <!-- Exercício 2: Campo CPF adicionado logo após a Data de Nascimento -->
                <div class="input-group">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required>
                </div>
            </fieldset>

            <!-- Seção 2: Preferências e Perfil (Com Exercício 3) -->
            <fieldset class="section">
                <legend class="section-title">2. Preferências e Perfil</legend>

                <div class="input-group">
                    <label for="area">Área de Interesse *</label>
                    <select id="area" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="tecnologia">Tecnologia</option>
                        <option value="design">Design</option>
                        <option value="negocios">Negócios</option>
                        <!-- Exercício 3.1: Novas opções adicionadas -->
                        <option value="desenvolvimento-mobile">Desenvolvimento Mobile</option>
                        <option value="ciencia-de-dados">Ciência de Dados</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Nível de Experiência</label>
                    <div class="radio-group">
                        <!-- Exercício 3.2: Iniciante marcado por padrão -->
                        <label><input type="radio" name="nivel" value="Iniciante" checked> Iniciante</label>
                        <label><input type="radio" name="nivel" value="Intermediário"> Intermediário</label>
                        <label><input type="radio" name="nivel" value="Avançado"> Avançado</label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="biografia">Biografia / Apresentação</label>
                    <textarea id="biografia" placeholder="Conte um pouco sobre suas expectativas..."></textarea>
                </div>
            </fieldset>

            <!-- Seção 3: Redes Sociais (Exercício 5) -->
            <fieldset class="section">
                <legend class="section-title">3. Redes Sociais</legend>

                <div class="input-group">
                    <label for="instagram">Instagram *</label>
                    <!-- Exercício 5.3: Type url para validação nativa -->
                    <input type="url" id="instagram" placeholder="https://instagram.com/seuusuario" required>
                </div>

                <div class="input-group">
                    <label for="github">GitHub *</label>
                    <input type="url" id="github" placeholder="https://github.com/seuusuario" required>
                </div>
            </fieldset>

            <!-- Checkbox de Termos -->
            <div class="checkbox-group">
                <input type="checkbox" id="novidades">
                <label for="novidades">Aceito receber novidades por e-mail</label>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn-submit">Concluir Cadastro</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
